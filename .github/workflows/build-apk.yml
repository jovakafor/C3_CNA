name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make the Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          echo '{"appId":"com.jovakafor.c3sna","appName":"C3 SNA","webDir":"www","backgroundColor":"#ffffff"}' > capacitor.config.json
          npx cap add android

      - name: Folder picker, app icon and loading screen
        run: |
          JP=android/app/src/main/java/com/jovakafor/c3sna
          R=android/app/src/main/res
          mkdir -p $JP
          cat > $JP/FolderPlugin.java <<'JAVA'
          package com.jovakafor.c3sna;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.DocumentsContract;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "Folder")
          public class FolderPlugin extends Plugin {

            @PluginMethod
            public void pick(PluginCall call) {
              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION | Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
              startActivityForResult(call, i, "pickDone");
            }

            @ActivityCallback
            private void pickDone(PluginCall call, ActivityResult result) {
              if (call == null) return;
              JSObject o = new JSObject();
              if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null && result.getData().getData() != null) {
                Uri u = result.getData().getData();
                try {
                  getContext().getContentResolver().takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                } catch (Exception e) {}
                String id = DocumentsContract.getTreeDocumentId(u);
                String nm = id;
                int k = id.indexOf(':');
                if (k >= 0) nm = id.substring(k + 1);
                if (nm.length() == 0) nm = "Main storage";
                o.put("uri", u.toString());
                o.put("name", nm);
              } else {
                o.put("uri", "");
              }
              call.resolve(o);
            }

            @PluginMethod
            public void save(PluginCall call) {
              try {
                Uri tree = Uri.parse(call.getString("uri"));
                String name = call.getString("name");
                String mime = call.getString("mime");
                String data = call.getString("data");
                ContentResolver cr = getContext().getContentResolver();
                Uri parent = DocumentsContract.buildDocumentUriUsingTree(tree, DocumentsContract.getTreeDocumentId(tree));
                Uri f = DocumentsContract.createDocument(cr, parent, mime, name);
                if (f == null) {
                  call.reject("Could not create the file");
                  return;
                }
                OutputStream os = cr.openOutputStream(f);
                os.write(Base64.decode(data, Base64.DEFAULT));
                os.close();
                JSObject o = new JSObject();
                o.put("uri", f.toString());
                call.resolve(o);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          JAVA
          cat > $JP/MainActivity.java <<'JAVA'
          package com.jovakafor.c3sna;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(FolderPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          cat > make_assets.py <<'PY'
          import base64,io,os,sys
          from PIL import Image,ImageDraw
          res=sys.argv[2]
          ink=Image.open(io.BytesIO(base64.b64decode(open(sys.argv[1]).read().strip()))).convert('L')
          def logo(size,pad=0.0):
              s=int(size*(1-2*pad)); m=ink.resize((s,s),Image.LANCZOS)
              o=Image.new('RGBA',(size,size),(0,0,0,0)); c=Image.new('RGBA',(s,s),(17,17,17,255)); c.putalpha(m); o.paste(c,((size-s)//2,(size-s)//2),c); return o
          def save(i,p):
              os.makedirs(os.path.dirname(p),exist_ok=True); i.save(p,'PNG',optimize=True)
          for d,f in {'mdpi':1,'hdpi':1.5,'xhdpi':2,'xxhdpi':3,'xxxhdpi':4}.items():
              L=int(48*f);F=int(108*f)
              ic=Image.new('RGBA',(L,L),(255,255,255,255));ic.alpha_composite(logo(L,.14));save(ic,f'{res}/mipmap-{d}/ic_launcher.png')
              mk=Image.new('L',(L*4,L*4),0);ImageDraw.Draw(mk).ellipse((0,0,L*4-1,L*4-1),fill=255);mk=mk.resize((L,L),Image.LANCZOS)
              r=Image.new('RGBA',(L,L),(0,0,0,0));r.paste(ic,(0,0),mk);save(r,f'{res}/mipmap-{d}/ic_launcher_round.png')
              save(logo(F,.20),f'{res}/mipmap-{d}/ic_launcher_foreground.png')
          save(logo(420),f'{res}/drawable-nodpi/c3_logo.png')
          PY
          echo "" > master.b64
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages pillow
          python3 make_assets.py master.b64 $R
          find $R -name 'splash.png' -delete
          cat > $R/drawable/splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item>
              <shape android:shape="rectangle">
                <solid android:color="#FFFFFF"/>
              </shape>
            </item>
            <item>
              <bitmap android:src="@drawable/c3_logo" android:gravity="center"/>
            </item>
          </layer-list>
          XML
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFFFFF</color></resources>' > $R/values/ic_launcher_background.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
          grep -c screenOrientation android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: c3sna-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
