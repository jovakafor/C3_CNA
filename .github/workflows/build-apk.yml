name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make the Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          echo '{"appId":"com.jovakafor.c3sna","appName":"C3 SNA","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: c3sna-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
