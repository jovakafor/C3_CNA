*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 100px}
.pg{animation:pgin .18s ease-out}@keyframes pgin{from{opacity:0}to{opacity:1}}
input,textarea,.sel{-webkit-user-select:text;user-select:text}
.lg{display:block;width:92px;height:92px;margin:2px auto 6px;color:var(--tx)}
.keybox{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:10px;margin-top:6px}
.cp{display:flex;align-items:center;gap:6px;background:var(--pr);color:var(--pt);border:0;border-radius:50px;padding:9px 16px;font-weight:600;font-size:14px}
.cp svg,.sm svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fold{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.fold .btn{flex:none;padding:7px 12px;font-size:13px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:18px 0 8px}h3{font-size:16px;margin:0 0 6px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.big{display:block;width:100%;text-align:center;border:0;border-radius:16px;padding:26px 18px;margin:10px 0;font:inherit;cursor:pointer}
.big b{display:block;font-size:20px}.big span{font-size:14px;opacity:.85}
.b1{background:var(--pr);color:var(--pt)}.b2{background:var(--ac);color:#1b1500}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:12px;padding:12px 16px;font-weight:600}
.btn.o{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.back{background:none;border:0;color:var(--pr);font-weight:600;padding:8px 0}
.list{border:1px solid var(--bd);border-radius:10px;max-height:190px;overflow:auto;background:var(--sf);margin-top:4px}
.list div{padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer}.list div:last-child{border:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:var(--sf);border:1px solid var(--bd);border-top:3px solid var(--c,var(--pr));border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(15,40,55,.06)}
@supports (background:color-mix(in srgb,red 10%,white)){.stat{background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--pr)) 10%,var(--sf)),var(--sf) 85%)}}
.stat b{display:block;font-size:22px;line-height:1.2;color:var(--c,var(--tx))}.stat span{font-size:12.5px;color:var(--mu);line-height:1.3;display:block;margin-top:2px}
.pl{display:inline-block;border:1px solid var(--c);color:var(--c);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;margin:3px 5px 0 0}
.rd{padding:12px 0;border-bottom:1px solid var(--bd)}.rd:last-child{border:0}.rh{display:flex;justify-content:space-between;align-items:baseline}
.rh span{font-weight:700;color:var(--k1)}
.sec{display:flex;align-items:center;gap:8px;margin:0 0 4px}.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--c,var(--pr))}
.levy{background:var(--pr);color:var(--pt);border-radius:12px;padding:12px;margin-top:12px}.levy b{font-size:22px}
.up{color:var(--ok);font-weight:700}.dn{color:#c0392b;font-weight:700}
.item{cursor:pointer}.pill{display:inline-block;font-size:12px;border:1px solid var(--bd);border-radius:20px;padding:2px 9px;color:var(--mu)}
.leg{font-size:12px;color:var(--mu);margin:2px 0 4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 8px;vertical-align:-1px}.leg i:first-child{margin-left:0}
.ch{display:flex;justify-content:space-between;align-items:center}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;max-width:528px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{display:flex;max-width:560px;margin:0 auto}
.nav button{flex:1;background:none;border:0;padding:9px 2px 7px;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pr);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:20px;padding:7px 12px;font-size:14px}
.chips button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sl{width:180px;height:180px;animation:wipe 1.9s cubic-bezier(.65,.05,.3,1) .2s both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#splash .st{margin-top:18px;font:600 15px/1 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--tx);animation:fadeup .8s ease 2s both}
#splash .ss{margin-top:8px;font:13px/1 system-ui,sans-serif;color:var(--mu);animation:fadeup .8s ease 2.4s both}
#splash .sb{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:120px;height:3px;border-radius:3px;background:var(--bd);overflow:hidden}
#splash .sb i{display:block;height:100%;width:40%;border-radius:3px;background:var(--pr);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* v2.4 polish */
h1{font-size:27px;font-weight:700;letter-spacing:-.01em;margin:10px 0 4px}h3{font-weight:650}
.card{border-radius:16px;border-color:#e4e9ee;box-shadow:0 1px 2px rgba(16,40,60,.05),0 4px 14px rgba(16,40,60,.04);padding:16px}
:root[data-theme="dark"] .card{border-color:var(--bd);box-shadow:none}
.stat{border-radius:14px;box-shadow:none;padding:12px 13px}.stat b{font-size:24px;letter-spacing:-.01em}
.tabs button{padding:9px 2px;font-size:13px;border-radius:12px;white-space:nowrap}
.btn{border-radius:12px;padding:13px 16px}input,textarea{border-radius:12px;padding:12px}
.nav{box-shadow:0 -2px 12px rgba(16,40,60,.06)}.mu{line-height:1.4}.back{font-size:15px}
.hide{display:none}
.nav button{position:relative}.bdg{position:absolute;top:3px;left:calc(50% + 6px);background:#d92d20;color:#fff;font:700 10px/1 system-ui,sans-serif;border-radius:10px;padding:3px 5px;min-width:16px;text-align:center;font-style:normal}
.chip{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid var(--c,var(--mu));color:var(--c,var(--mu))}
.btn.sm{padding:8px 14px;font-size:14px}.btn.ok{background:var(--k3);color:#fff}.btn.no{background:transparent;color:#c0392b;border:1px solid #c0392b}
.q{background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.pwb{position:relative}.pwb input{padding-right:46px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu);width:42px;height:42px;display:flex;align-items:center;justify-content:center}.eye svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
h1{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15}h3{font-weight:700;letter-spacing:-.005em}
.pg{animation:pgin .22s ease-out both}@keyframes pgin{from{opacity:0}to{opacity:1}}
.pg>*:not(nav):not(#nv):not(.role):not(.hero){animation:kid .3s var(--ease) both}@keyframes kid{from{transform:translateY(10px)}to{transform:none}}
.card{border-radius:18px;box-shadow:var(--sh);border-color:color-mix(in srgb,var(--bd) 70%,transparent)}
button,.item,.role,.chips button,.tabs button{transition:transform .14s var(--ease),filter .14s,background-color .2s,color .2s,border-color .2s}
button:active,.item:active{transform:scale(.97)}
.btn{border-radius:14px;min-height:48px;box-shadow:0 6px 16px rgba(11,47,107,.22)}.btn.o,.btn.no,.btn.sm{box-shadow:none}.btn:active{filter:brightness(.92)}
input,textarea{border-radius:12px;min-height:48px;border-color:var(--bd);transition:border-color .2s,box-shadow .2s}
textarea{min-height:0}input:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 4px var(--tint)}
.tabs button,.chips button{border-radius:999px}.tabs button.on,.chips button.on{box-shadow:0 4px 12px rgba(11,47,107,.2)}
.stat{border-radius:16px;box-shadow:var(--sh)}
.levy{border-radius:16px;background:linear-gradient(135deg,var(--pr),color-mix(in srgb,var(--pr) 70%,#1d4ba6));box-shadow:0 8px 20px rgba(11,47,107,.25)}
.nav{border-top:0;box-shadow:0 -6px 24px rgba(10,30,60,.08);border-radius:22px 22px 0 0}
.nav button{position:relative;padding:10px 2px 8px}
.nav button svg{position:relative;transition:transform .25s var(--ease)}
.nav button.on svg{transform:translateY(-1px) scale(1.1)}
.nav button.on:before{content:"";position:absolute;top:7px;left:50%;width:54px;height:32px;margin-left:-27px;border-radius:16px;background:var(--tint);animation:pill .3s var(--ease) both}
@keyframes pill{from{opacity:0;transform:scaleX(.5)}to{opacity:1;transform:none}}
.bdg{box-shadow:0 0 0 2px var(--sf)}
#toast{border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .26s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* charts grow in */
.card svg>path[style]{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s var(--ease) both}
@keyframes grow{from{transform:scaleY(.04);opacity:.2}to{transform:none;opacity:1}}
.card svg>path[style]:nth-of-type(1){animation-delay:24ms}.card svg>path[style]:nth-of-type(2){animation-delay:48ms}.card svg>path[style]:nth-of-type(3){animation-delay:72ms}.card svg>path[style]:nth-of-type(4){animation-delay:96ms}.card svg>path[style]:nth-of-type(5){animation-delay:120ms}.card svg>path[style]:nth-of-type(6){animation-delay:144ms}.card svg>path[style]:nth-of-type(7){animation-delay:168ms}.card svg>path[style]:nth-of-type(8){animation-delay:192ms}.card svg>path[style]:nth-of-type(9){animation-delay:216ms}.card svg>path[style]:nth-of-type(10){animation-delay:240ms}.card svg>path[style]:nth-of-type(11){animation-delay:264ms}.card svg>path[style]:nth-of-type(12){animation-delay:288ms}.card svg>path[style]:nth-of-type(13){animation-delay:312ms}.card svg>path[style]:nth-of-type(14){animation-delay:336ms}.card svg>path[style]:nth-of-type(15){animation-delay:360ms}.card svg>path[style]:nth-of-type(16){animation-delay:384ms}.card svg>path[style]:nth-of-type(17){animation-delay:408ms}.card svg>path[style]:nth-of-type(18){animation-delay:420ms}.card svg>path[style]:nth-of-type(19){animation-delay:420ms}.card svg>path[style]:nth-of-type(20){animation-delay:420ms}.card svg>path[style]:nth-of-type(21){animation-delay:420ms}.card svg>path[style]:nth-of-type(22){animation-delay:420ms}.card svg>path[style]:nth-of-type(23){animation-delay:420ms}.card svg>path[style]:nth-of-type(24){animation-delay:420ms}
/* loading bar + skeleton */
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;overflow:hidden;opacity:0;transition:opacity .25s;pointer-events:none}
.busy #bar{opacity:1}#bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:slide 1s ease-in-out infinite}
.sk{border-radius:16px;background:var(--sf);border:1px solid var(--bd);padding:16px;margin:12px 0;overflow:hidden;position:relative}
.sk b{display:block;height:12px;border-radius:6px;background:var(--bd);margin:8px 0;opacity:.6}
.sk:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);animation:shim 1.3s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.vbot{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mu);font-size:13px;letter-spacing:.02em;pointer-events:none}
.cname{display:inline-block;margin:0;font-weight:800;font-size:17px;letter-spacing:-.01em}.dup{margin-left:6px;vertical-align:2px}
/* creator card */
.cre{border-top:3px solid var(--pr);padding:10px 12px;margin:12px 0 8px}.cre .who{display:flex;align-items:center;gap:10px}
.cre .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;background:linear-gradient(135deg,#0b2f6b,#1d4ba6)}
.cre .tx{min-width:0}.cre b{display:block;font-size:14.5px;line-height:1.2}.cre .tx span{display:block;font-size:12px;line-height:1.3;color:var(--mu)}
.cre .row{margin-top:8px;gap:8px}.cre a.btn{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:38px;padding:6px 10px;font-size:13px;border-radius:12px;box-shadow:none}
.cre a.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cre .ln{font-size:12px;color:var(--mu);margin-top:6px;text-align:center;word-break:break-all}
/* welcome screen */
.hero{position:relative;overflow:hidden;margin:calc(-16px - env(safe-area-inset-top,0px)) -16px 8px;padding:calc(44px + env(safe-area-inset-top,0px)) 24px 38px;text-align:center;color:#fff;background:linear-gradient(160deg,#08235a 0%,#0b2f6b 45%,#1d4ba6 100%);border-radius:0 0 34px 34px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{width:260px;height:260px;right:-90px;top:-80px;background:radial-gradient(circle,rgba(240,180,41,.28),transparent 68%)}
.hero:after{width:300px;height:300px;left:-130px;bottom:-150px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.hero .lg{width:112px;height:112px;color:#fff;margin:0 auto 6px;position:relative;animation:rise .7s var(--ease) both}
.hero h1{color:#fff;text-align:center;margin:6px 0 4px;position:relative;animation:rise .7s var(--ease) .08s both}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:15px;position:relative;animation:rise .7s var(--ease) .16s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.role{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:22px;padding:18px 18px;margin:14px 0 0;text-align:left;box-shadow:0 10px 26px rgba(10,30,60,.14);animation:rise .6s var(--ease) both}
.role.r1{background:linear-gradient(135deg,#0b2f6b,#1d4ba6);color:#fff;animation-delay:.24s}.role.r2{background:linear-gradient(135deg,#f0b429,#e0a100);color:#1b1500;animation-delay:.32s}
.role b{flex:1;font-size:18px;letter-spacing:-.01em}
.role .ri{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.16)}.role.r2 .ri{background:rgba(0,0,0,.09)}
.role svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.role .go{width:20px;height:20px;opacity:.7}
.role:active{transform:scale(.98)}
/* launch screen: a curtain slides away (transform only, so it stays smooth) */
#splash{background:var(--bg);transition:opacity .55s ease}
#splash .sw{position:relative;width:190px;height:190px;animation:pop 2.2s var(--ease) both}
#splash .sl{position:absolute;inset:0;width:100%;height:100%;animation:none;clip-path:none;color:var(--tx)}
#splash .cur{position:absolute;inset:-6px;background:var(--bg);transform-origin:100% 50%;box-shadow:-26px 0 22px 4px var(--bg);animation:unc 1.8s cubic-bezier(.65,.05,.25,1) .3s both}
@keyframes unc{from{transform:translateX(0)}to{transform:translateX(112%)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
.avatar{position:relative;width:116px;height:116px;border-radius:50%;margin:6px auto 8px;background:var(--bd);border:3px solid var(--ac);overflow:hidden;display:flex;align-items:center;justify-content:center}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar .ini{font-size:44px;font-weight:700;color:var(--pr)}.avatar .ini.pf{font-size:17px;font-weight:700;letter-spacing:.02em}.avatar #avi{display:flex;width:100%;height:100%;align-items:center;justify-content:center}.avatar input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.vchip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}.vchip.ok{background:#dcf1e6;color:#175a3a}.vchip.no{background:#fff0cc;color:#6b4a00}
/* ===== v3.0 theme: dark gray default, light optional ===== */
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px;margin-top:8px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;color:var(--mu);padding:11px 8px;border-radius:10px;font-weight:700;font-size:14px}
.seg button i{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor}.seg button i.l{background:#fff}.seg button i.d{background:#262a31}
.seg button.on{background:var(--pr);color:var(--pt);box-shadow:0 2px 8px rgba(0,0,0,.18)}.seg button.on i{border-color:var(--pt)}
:root[data-theme="dark"] .levy{background:linear-gradient(135deg,#1d4ba6,#0b2f6b);color:#fff}
:root[data-theme="dark"] .btn{box-shadow:none}
:root[data-theme="dark"] .role.r2{background:linear-gradient(135deg,#c99a1d,#b8860b);color:#1b1500}
:root[data-theme="dark"] .vchip.ok{background:#1d3a2c;color:#8fe0b4}
:root[data-theme="dark"] .vchip.no{background:#3d3318;color:#f3cf7a}
:root[data-theme="dark"] .sk:after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%)}
:root[data-theme="dark"] #toast{background:#3a404a;color:#fff}
:root[data-theme="dark"] .nav{box-shadow:0 -6px 24px rgba(0,0,0,.35)}
:root[data-theme="dark"] input,:root[data-theme="dark"] textarea{background:#1c1f24;color:var(--tx)}

/* website: desktop screens */
@media (min-width:900px){
#app{max-width:820px}
.nav{left:50%;right:auto;width:560px;margin-left:-280px}
.stats{grid-template-columns:repeat(4,1fr)}
svg[role="img"][width="100%"]{display:block;max-width:640px;margin:0 auto}
}
@media (hover:hover) and (pointer:fine){
body{-webkit-user-select:text;user-select:text}
button,.item,.role,.tabs button,.nav button{cursor:pointer}
.btn:hover,.role:hover{filter:brightness(1.07)}
.item:hover{background:rgba(127,127,127,.07)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
}
