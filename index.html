<style>
:root{--bg:#f1f4f0;--card:#fff;--ink:#14231c;--mut:#5c6b63;--line:#dde4de;--g:#1b7f4a;--g2:#e3f3ea;--red:#c4302b;--red2:#fbe6e4;--gold:#e8a400;--gold2:#fff3d1;--r:14px}
[data-theme="dark"]{--bg:#0f1713;--card:#17221c;--ink:#e8f0ea;--mut:#8fa196;--line:#273530;--g:#3fbf7c;--g2:#173a28;--red:#ff7a72;--red2:#3a1b19;--gold:#f2b632;--gold2:#3a2e0d}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{display:flex;min-height:100vh}
#side{display:none;width:230px;padding:20px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--card)}
#main{flex:1;min-width:0;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
#view{padding:16px;max-width:820px;margin:0 auto}
h2{font-size:20px;margin:4px 0 12px}h3{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px;border:0}
[data-theme="dark"] .hero{background:#1d3a2b}
.hero small{opacity:.75;display:block}.hero .big{font-size:38px;font-weight:700;letter-spacing:-1px}
.hero .row{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}.hero .row div{font-size:13px}.hero .row b{display:block;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:10px;padding:10px 12px}
.stat small{color:var(--mut);display:block;font-size:12.5px}.stat b{font-size:18px}
.stat.gold{border-left-color:var(--gold)}.stat.red{border-left-color:var(--red)}.stat.ink{border-left-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:44px}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}.btn.d{color:var(--red);border-color:var(--red)}.btn.s{min-height:36px;padding:6px 10px;font-size:14px}
.btn.w{width:100%}
.field{margin-bottom:12px}.field label{display:block;font-size:13.5px;color:var(--mut);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b-ok{background:var(--g2);color:var(--g)}.b-low{background:var(--gold2);color:#9a6b00}.b-out{background:var(--red2);color:var(--red)}.b-n{background:var(--bg);color:var(--mut)}
[data-theme="dark"] .b-low{color:var(--gold)}
.ledger>div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}.ledger>div:last-child{border:0}
.ledger span:last-child{text-align:right}.mut{color:var(--mut);font-size:13px}
.pos{color:var(--g)}.neg{color:var(--red)}
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.prow h4{margin:0;font-size:17px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.bar i{display:block;width:100%;background:var(--g2);border-radius:6px 6px 0 0;position:relative;min-height:2px}.bar i u{position:absolute;bottom:0;left:0;right:0;background:var(--g);border-radius:0 0 0 0}
.meter{height:7px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--g)}
.meter.low i{background:var(--gold)}.meter.out i{background:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap}.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}

.scroll{overflow-x:auto}
#bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
#bnav button,#side button{background:none;border:0;cursor:pointer}
#bnav button{flex:1;padding:8px 2px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
#bnav button.on{color:var(--g);font-weight:700}#bnav svg{width:22px;height:22px}
#side button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 12px;border-radius:10px;color:var(--ink);text-align:left}
#side button.on{background:var(--g2);color:var(--g);font-weight:700}#side svg{width:20px;height:20px}
#side .logo{font-weight:800;font-size:20px;padding:4px 12px 16px}
@media(min-width:900px){#side{display:block}#bnav{display:none}#main{padding-bottom:30px}.grid{grid-template-columns:repeat(4,1fr)}}
.fab{position:fixed;right:16px;bottom:78px;z-index:4;border-radius:99px;padding:0 20px;min-height:52px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media(min-width:900px){.fab{bottom:24px}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}#sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;animation:up .18s ease-out}
@media(min-width:900px){#modal{align-items:center}#sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#sheet{animation:none}}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}.prod.open{border-color:var(--g)}
.ph{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;min-height:60px;background:none;border:0;text-align:left;cursor:pointer}
.pt{flex:1;min-width:0;display:flex;flex-direction:column}.pt b{font-size:16.5px}.pt .mut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev svg{width:22px;height:22px;color:var(--mut);transition:transform .15s;display:block}.open .chev svg{transform:rotate(180deg)}
.pb{padding:2px 14px 14px;border-top:1px dashed var(--line)}.btn[disabled]{opacity:.4;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.chev svg{transition:none}}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{flex:1;padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;line-height:1.3}.seg button small{font-weight:400;font-size:12px;opacity:.8}.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
#splash{position:fixed;inset:0;z-index:99;background:#1b7f4a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}#splash.off{opacity:0;pointer-events:none}
.sp-in{text-align:center}.sp-in h1{margin:16px 0 2px;font-size:32px;letter-spacing:.3px}.sp-in p{margin:0 0 24px;opacity:.85}.sp-bar{width:150px;height:5px;border-radius:5px;background:rgba(255,255,255,.3);margin:0 auto;overflow:hidden}.sp-bar i{display:block;height:100%;width:40%;background:#f2b632;border-radius:5px;animation:spb 1s ease-in-out infinite}
@keyframes spb{0%{transform:translateX(-100%)}100%{transform:translateX(375%)}}.sp-ver{position:absolute;bottom:30px;font-size:14px;opacity:.85}
@media(prefers-reduced-motion:reduce){.sp-bar i{animation:none;width:100%}}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:15px 4px;background:none;border:0;border-bottom:1px solid var(--line);font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}.mrow:last-child{border-bottom:0}.mrow svg{width:18px;height:18px;color:var(--mut);flex:none}.mrow span{flex:1}.mrow .go{transform:rotate(-90deg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;display:none;max-width:90%;font-size:14px}
#toast.err{background:var(--red)}
.prev{background:var(--g2);border-radius:10px;padding:10px 12px;margin-bottom:12px}.prev .ledger>div{border-color:rgba(0,0,0,.08)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.warn{background:var(--gold2);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
#print{display:none}
@media print{@page{size:A4;margin:14mm}body{background:#fff;color:#000}#app,#modal,#toast{display:none!important}#print{display:block;font-size:11px}#print h1{font-size:20px}#print h2{font-size:14px;margin:14px 0 4px;border-bottom:2px solid #1b7f4a}#print table{font-size:10px}#print th,#print td{border-bottom:1px solid #ccc}}
</style>

<body>
<div id="splash"><div class="sp-in"><svg viewBox="0 0 512 512" width="120" height="120" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1b7f4a"/><path d="M176 230V192a80 80 0 0 1 160 0v38" fill="none" stroke="#fff" stroke-width="18"/><path d="M166 214H346L380 398H132Z" fill="#fff" stroke="#fff" stroke-width="40" stroke-linejoin="round"/><circle cx="256" cy="308" r="58" fill="#f2b632"/><text x="256" y="338" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="700" text-anchor="middle" fill="#1b7f4a">K</text></svg><h1>myShop</h1><p>Your shop, made simple</p><div class="sp-bar"><i></i></div></div><div class="sp-ver">Version 0.4</div></div>
<div id="app">
  <aside id="side"></aside>
  <div id="main">
    <header><h1 id="ttl">myShop</h1></header>
    <div id="view"></div>
  </div>
</div>
<nav id="bnav"></nav>

<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const VERSION='0.4';
const LOGO='<svg viewBox="0 0 512 512" width="96" height="96" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1b7f4a"/><path d="M176 230V192a80 80 0 0 1 160 0v38" fill="none" stroke="#fff" stroke-width="18"/><path d="M166 214H346L380 398H132Z" fill="#fff" stroke="#fff" stroke-width="40" stroke-linejoin="round"/><circle cx="256" cy="308" r="58" fill="#f2b632"/><text x="256" y="338" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="700" text-anchor="middle" fill="#1b7f4a">K</text></svg>';

let THEME='green';try{THEME=localStorage.getItem('myshop_theme')||'green'}catch(e){}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',{green:'#1b7f4a',dark:'#0f1713',sunset:'#d9590b'}[t]||'#1b7f4a')}
applyTheme(THEME);
function V(sel){const e=$(sel);const c=String(e.value||'').replace(/[^0-9.]/g,'');return c===''?0:+c}
function fmtInput(el){
  const raw=el.value||'',foc=document.activeElement===el,pos=foc?el.selectionStart:raw.length;
  const before=raw.slice(0,pos).replace(/[^0-9.]/g,'').length,parts=raw.replace(/[^0-9.]/g,'').split('.');
  let ip=parts[0].replace(/^0+(?=\d)/,''),dp=parts.length>1?parts.slice(1).join(''):null;if(ip===''&&dp!==null)ip='0';
  ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const pre=el.dataset&&el.dataset.money?((typeof D==='function'&&D().currency)||'K')+' ':'';
  const out=(parts[0]===''&&dp===null)?'':pre+ip+(dp!==null?'.'+dp:'');
  if(out!==el.value)el.value=out;
  if(foc){let n=0,p=0;for(;p<out.length&&n<before;p++){if(/[0-9.]/.test(out[p]))n++}if(n===0)p=pre.length&&out?pre.length:0;try{el.setSelectionRange(p,p)}catch(e){}}
}
function setNum(sel,v){const el=$(sel);el.value=String(v);fmtInput(el)}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('num'))fmtInput(t)},true);
if(typeof MutationObserver!=='undefined')new MutationObserver(()=>{document.querySelectorAll('input.num').forEach(el=>{if(el.value&&document.activeElement!==el)fmtInput(el)})}).observe(document.body,{childList:true,subtree:true});
function facOf(u){return u==='Kilograms'||u==='Litres'?1000:1}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((n+Number.EPSILON)*100)/100, r3=n=>Math.round(n*1000)/1000;
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+rid()+rid();
const now=()=>Date.now(), DAY=864e5;
const clone=o=>JSON.parse(JSON.stringify(o));
const uniq=a=>[...new Set(a)];
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
const UNITS=['Units','Dozens','Kilograms','Grams','Litres','Packs','Cartons','Other'];
const EXP=['Transport','Electricity','Rent','Packaging','Other'];
const fmt=n=>(n<0?'-':'')+D().currency+Math.abs(r2(n)).toLocaleString(undefined,{maximumFractionDigits:2});
const qf=n=>r3(n).toLocaleString(undefined,{maximumFractionDigits:3});
const dt=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const tm=t=>new Date(t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}

/* ---------- database (in memory; mirrors the planned SQLite schema) ---------- */
let dbs=[null,null],cur=0,view='dashboard',period='week';
const D=()=>dbs[cur];
function newDB(name,shopId){return{shopId,deviceId:uid(),deviceName:name,shopName:'My Shop',named:false,currency:'K',products:[],moves:[],expenses:[],importLog:[],conflicts:[],backups:[]}}
function mk(extra,at){const t=at||now();return Object.assign({id:uid(),created:t,updated:t,deleted:null,device:D().deviceId,version:1,rv:rid(),prev:[]},extra)}
function touch(r){r.prev=[r.rv,...(r.prev||[])].slice(0,60);r.rv=rid();r.updated=now();r.device=D().deviceId;r.version=(r.version||1)+1}
const prods=()=>D().products.filter(p=>!p.deleted);
const pAny=id=>D().products.find(p=>p.id===id);
const stockOf=id=>r3(D().moves.filter(m=>m.pid===id&&!m.deleted).reduce((s,m)=>s+m.qty,0));
const isSale=m=>m.type==='sale'||m.type==='reversal';
const salesRows=(from=0)=>D().moves.filter(m=>!m.deleted&&isSale(m)&&m.at>=from);
const mRev=m=>-m.qty*m.price, mProfit=m=>-m.qty*(m.price-m.cost), mQty=m=>-m.qty;
const expRows=(from=0)=>D().expenses.filter(e=>!e.deleted&&e.at>=from);
function pStart(p){const d=new Date();d.setHours(0,0,0,0);if(p==='today')return d.getTime();if(p==='week'){d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}if(p==='month'){d.setDate(1);return d.getTime()}return 0}
function addMove(pid,type,qty,o={},at){const m=mk(Object.assign({pid,type,qty,totalCost:null,price:null,cost:null,reverses:null,note:'',at:at||now()},o),at);D().moves.push(m);return m}
/* selling units: stock is always counted in the stock unit (kg, litres, loaves...). A product may be sold in portions (e.g. a plate = 0.5 kg). */
const sz=p=>p.portion&&p.portion.size>0?p.portion.size:1;
const su=(p,n=2)=>{if(!p.portion)return p.unit;const s=p.portion.name.trim();return n===1||/s$/i.test(s)?s:s+'s'};
const SING={units:'unit',dozens:'dozen',kilograms:'kilogram',grams:'gram',litres:'litre',packs:'pack',cartons:'carton',loaves:'loaf'};
const sing=u=>{u=String(u||'unit').trim().toLowerCase();return SING[u]||(u.endsWith('ies')?u.slice(0,-3)+'y':u.length>3&&u.endsWith('s')?u.slice(0,-1):u)};
const isW=u=>['Kilograms','Grams','Litres','Millilitres'].includes(u);
const plural=n=>{n=n.trim();return /s$/i.test(n)?n:/[^aeiou]y$/i.test(n)?n.slice(0,-1)+'ies':n+'s'};
const ucost=p=>p.cpu*sz(p);
const mUnits=m=>(m.units??Math.abs(m.qty))*(m.qty<0?1:-1);
const mPrice=m=>{const u=mUnits(m);return u?r2(mRev(m)/u):m.price};
const stk=x=>x.p.portion?`${qf(x.stock)} ${x.p.unit} (≈${qf(x.left)} ${su(x.p,x.left)})`:`${qf(x.stock)} ${x.p.unit}`;
function pfac(unit){return ['Grams','Millilitres'].includes($('#f_pu').value)&&['Kilograms','Litres'].includes(unit)?1000:1}
function aTot(){const q=V('#a_q')||0,v=V('#a_t')||0;return $('#a_cm').value==='each'?v*q:v}
function sellMove(p,units,price,at){return addMove(p.id,'sale',-r3(units*sz(p)),{price:price/sz(p),cost:p.cpu,units,su:su(p,units)},at)}
function prodCard(x){
  const p=x.p,open=A.exp===p.id,pu=p.sell-x.uc,one=p.portion?p.portion.name.toLowerCase():sing(p.unit),u=x.su;
  const bad=x.status!=='ok'?`<span class="badge b-${x.status}">${x.status==='out'?'Out':'Low'}</span>`:'';
  return `<div class="prod ${open?'open':''}"><button class="ph" aria-expanded="${open}" onclick="A.tog('${p.id}')"><span class="pt"><b>${esc(p.name)}</b><span class="mut">${qf(x.left)} ${esc(u)} left${x.soldU>0?` · ${qf(x.soldU)} sold`:''} · ${fmt(p.sell)} each</span></span>${bad}<span class="chev">${svg('chev')}</span></button>
  ${open?`<div class="pb"><div class="ledger"><div><span>Left</span><span><b>${qf(x.left)}</b> ${esc(u)}${p.portion?`<br><span class="mut">${qf(x.stock)} ${esc(p.unit)} in stock · 1 ${esc(one)} = ${qf(p.portion.size)} ${esc(p.unit)}</span>`:''}</span></div>
   <div><span>Sold</span><span><b>${qf(x.soldU)}</b> ${esc(u)}</span></div><div><span>Money made so far</span><b>${fmt(x.rev)}</b></div><div><span>Profit made</span><span class="${x.pf<0?'neg':'pos'}">${fmt(x.pf)}</span></div>

/* ---------- analysis ---------- */
function analysis(){
  const t30=now()-30*DAY,sold={},tot={};
  D().moves.forEach(m=>{if(m.deleted||!isSale(m))return;const t=tot[m.pid]||(tot[m.pid]={u:0,rev:0,pf:0});t.u+=mUnits(m);t.rev+=mRev(m);t.pf+=mProfit(m);if(m.at>=t30)sold[m.pid]=(sold[m.pid]||0)+mQty(m)});
  const list=prods().map(p=>{const stock=stockOf(p.id),s30=Math.max(0,r3(sold[p.id]||0)),daily=s30/30;
    const status=stock<=0?'out':(stock<=p.min?'low':'ok');
    let restock=null;if(s30>0){if(status!=='ok')restock='urgent';else if(stock/daily<=7)restock='soon'}
    const suggest=Math.max(1,Math.ceil(Math.max(daily*14-stock,p.min*2-stock)));
    const k=sz(p),uc=ucost(p),left=Math.max(0,r3(stock/k)),t=tot[p.id]||{u:0,rev:0,pf:0};
    return{p,stock,s30,daily,status,restock,suggest,days:daily>0?Math.floor(stock/daily):null,k,uc,left,su:su(p,left),soldU:r3(t.u),rev:t.rev,pf:t.pf,remRev:left*p.sell,remPf:left*(p.sell-uc)}});
  const avg=list.length?list.reduce((s,x)=>s+x.s30,0)/list.length:0;
  list.forEach(x=>{x.speed=x.s30>0&&x.s30>=avg?'fast':(x.s30<avg*.5?'slow':'mid')});
  return list;
}
function bestSellers(from){
  const g={};salesRows(from).forEach(m=>{const x=g[m.pid]||(g[m.pid]={pid:m.pid,qty:0,rev:0,profit:0});x.qty+=mUnits(m);x.rev+=mRev(m);x.profit+=mProfit(m)});
  return Object.values(g).filter(x=>x.qty>0).sort((a,b)=>b.qty-a.qty||b.rev-a.rev);
}
function totals(from=0){const s=salesRows(from);const rev=s.reduce((a,m)=>a+mRev(m),0),gp=s.reduce((a,m)=>a+mProfit(m),0),ex=expRows(from).reduce((a,e)=>a+e.amount,0);return{rev,cost:rev-gp,gp,ex,net:gp-ex}}

togHist(){A.hist=!A.hist;$('#hist').style.display=A.hist?'block':'none';$('#histw').classList.toggle('open',A.hist);$('#histw').querySelector('.ph').setAttribute('aria-expanded',String(A.hist))},

undoSale(id){const m=D().moves.find(x=>x.id===id);A.open(`<h2>Undo this sale?</h2><p>${esc(pAny(m.pid)?.name)} × ${qf(m.units??-m.qty)}${m.su?' '+esc(m.su):''} (${fmt(mRev(m))}). The stock goes back and a correction is added to your history. The original stays on record.</p><div class="two"><button class="btn" onclick="A.close()">Keep sale</button><button class="btn d" onclick="A.doUndo('${id}')">Undo sale</button></div>`)},

/* ---------- .sdata export / import / merge ---------- */
exportSdata(){const d=D();const tables={products:d.products,moves:d.moves,expenses:d.expenses};
  const f={format:'shopbook-sdata',version:1,exportId:uid(),exportedAt:now(),shopId:d.shopId,shopName:d.shopName,currency:d.currency,sourceDevice:d.deviceName,tables};f.checksum=hash(JSON.stringify(tables));
  dl(`${d.shopName.replace(/\W+/g,'_')}_${new Date().toISOString().slice(0,10)}.sdata`,JSON.stringify(f),'application/json');toast('Shop data exported')},
importFile(el){const file=el.files[0];if(!file)return;const r=new FileReader();r.onload=()=>A.importText(r.result,file.name);r.readAsText(file);el.value=''},
importText(txt,name){
  let f;try{f=JSON.parse(txt)}catch(e){return toast('This is not a valid shop file','err')}
  if(f.format!=='shopbook-sdata'||!f.tables)return toast('This file was not made by myShop','err');
  if(f.version>1)return toast('File is from a newer version of the app','err');
  if(hash(JSON.stringify(f.tables))!==f.checksum)return toast('File is damaged or was edited. Import cancelled.','err');
  const d=D();
  if(f.shopId!==d.shopId){A.pending=f;if(!d.products.length&&!d.moves.length&&!d.expenses.length)return A.joinShop();return A.open(`<h2>Join “${esc(f.shopName)}”?</h2><p>This file is from the shop “${esc(f.shopName)}”. If you join, this phone gets that shop's name and records. The records now on this phone are backed up first, then replaced.</p><div class="two"><button class="btn" onclick="A.close()">Cancel</button><button class="btn d" onclick="A.joinShop()">Join that shop</button></div>`)}
  if(d.importLog.some(l=>l.exportId===f.exportId))return A.open(`<h2>Already imported</h2><p>You imported this exact file before, so nothing was changed and nothing was duplicated.</p><button class="btn p w" onclick="A.close()">OK</button>`);
  A.backup('Before import');if(f.shopName&&f.shopName!==d.shopName){d.shopName=f.shopName}
  const st={added:0,updated:0,skipped:0,conflicts:0};
  ['products','moves','expenses'].forEach(t=>mergeTable(t,f.tables[t]||[],st));
  d.importLog.push({exportId:f.exportId,from:f.sourceDevice+' ('+name+')',at:now(),added:st.added,updated:st.updated,conflicts:st.conflicts});
  render();
  A.open(`<h2>Import finished</h2><div class="ledger"><div><span>New records added</span><b>${st.added}</b></div><div><span>Records updated</span><b>${st.updated}</b></div><div><span>Already up to date</span><b>${st.skipped}</b></div><div><span>Conflicts</span><b class="${st.conflicts?'neg':''}">${st.conflicts}</b></div></div><p class="mut">A backup was saved before importing.${st.conflicts?' Review the conflicts on the Data Sharing screen.':''}</p><button class="btn p w" onclick="A.close()">Done</button>`);
},
joinShop(){const f=A.pending,d=D();A.backup('Before joining shop');d.shopId=f.shopId;d.shopName=f.shopName;d.named=true;d.currency=f.currency;d.products=clone(f.tables.products||[]);d.moves=clone(f.tables.moves||[]);d.expenses=clone(f.tables.expenses||[]);d.conflicts=[];d.importLog=[{exportId:f.exportId,from:f.sourceDevice,at:now(),added:d.products.length+d.moves.length+d.expenses.length,updated:0,conflicts:0}];A.close();render();toast('Joined '+f.shopName)},
conflictCard(c){
  const label=c.table==='products'?c.mine.name:c.table==='expenses'?c.mine.kind:(pAny(c.mine.pid)?.name||'Record');
  const keys=['name','category','unit','sell','cpu','min','amount','note','qty','price','deleted','portion'];const diffs=keys.filter(k=>JSON.stringify(c.mine[k])!==JSON.stringify(c.theirs[k]));
  const show=v=>v===null||v===undefined?'(none)':(typeof v==='number'&&v>1e11?'deleted':typeof v==='object'?esc(v.name+' ('+v.size+')'):esc(v));
  return `<div class="card"><b>${esc(label)}</b><div class="mut">Two phones changed this at the same time. The newer change is kept for now (${c.kept==='mine'?'yours':'theirs'}).</div><div class="ledger">${diffs.map(k=>`<div><span>${k}</span><span>Yours: ${show(c.mine[k])}<br>Theirs: ${show(c.theirs[k])}</span></div>`).join('')}</div><div class="two" style="margin-top:8px"><button class="btn s" onclick="A.resolve('${c.id}','mine')">Use mine</button><button class="btn s" onclick="A.resolve('${c.id}','theirs')">Use theirs</button></div></div>`},
resolve(cid,choice){const d=D(),c=d.conflicts.find(x=>x.id===cid),rec=d[c.table].find(x=>x.id===c.rid),src=clone(choice==='mine'?c.mine:c.theirs);
  const prev=uniq([rec.rv,...rec.prev,c.mine.rv,c.theirs.rv,...c.mine.prev,...c.theirs.prev]).slice(0,60);
  Object.keys(rec).forEach(k=>delete rec[k]);Object.assign(rec,src);rec.prev=prev;rec.rv=rid();rec.updated=now();rec.device=d.deviceId;rec.version=(rec.version||1)+1;c.resolved=true;refresh();toast('Conflict resolved')},

function dl(name,text,type){if(window.ShopBookNative&&window.ShopBookNative.shareFile){try{window.ShopBookNative.shareFile(name,btoa(unescape(encodeURIComponent(text))));return}catch(e){}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* merge: add new, adopt newer, detect conflicts, keep tombstones */
function relate(l,r){if(l.rv===r.rv)return 'same';if((l.prev||[]).includes(r.rv))return 'local-newer';if((r.prev||[]).includes(l.rv))return 'remote-newer';return 'conflict'}
function mergeTable(name,remote,st){
  const local=D()[name];
  remote.forEach(r=>{const i=local.findIndex(x=>x.id===r.id);
    if(i<0){local.push(clone(r));st.added++;return}
    const l=local[i],rel=relate(l,r);
    if(rel==='same'||rel==='local-newer'){st.skipped++;return}
    if(rel==='remote-newer'){local[i]=clone(r);st.updated++;return}
    const rw=r.updated>l.updated||(r.updated===l.updated&&r.rv>l.rv);const win=clone(rw?r:l),lose=rw?l:r;
    win.prev=uniq([...(win.prev||[]),lose.rv,...(lose.prev||[])]).slice(0,60);
    D().conflicts.push({id:uid(),table:name,rid:r.id,mine:clone(l),theirs:clone(r),kept:rw?'theirs':'mine',resolved:false,at:now()});
    local[i]=win;st.conflicts++});
}
