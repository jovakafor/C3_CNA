<style>

.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx)}

.nav button.on{color:var(--pr);font-weight:700}

.chips button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:20px;padding:7px 12px;font-size:14px}
.chips button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.hide{display:none}
</style></head><body>

<script>
var CT=[["Zambia","ZMW","Kwacha","ZM"],["Malawi","MWK","Kwacha","MW"],["Zimbabwe","USD","US Dollar","ZW"],["South Africa","ZAR","Rand","ZA"],["Botswana","BWP","Pula","BW"],["Namibia","NAD","Namibian Dollar","NA"],["Mozambique","MZN","Metical","MZ"],["Angola","AOA","Kwanza","AO"],["Tanzania","TZS","Shilling","TZ"],["Lesotho","LSL","Loti","LS"],["Eswatini","SZL","Lilangeni","SZ"],["DR Congo","CDF","Congolese Franc","CD"]];

var churches=[
{id:1,name:"C3 Lusaka Central",country:"Zambia",city:"Lusaka",leader:"Pastor Mwansa",contact:"+260 97 000 0001"},
{id:2,name:"C3 Kitwe",country:"Zambia",city:"Kitwe",leader:"Pastor Banda",contact:"+260 96 000 0002"},
{id:3,name:"C3 Lilongwe",country:"Malawi",city:"Lilongwe",leader:"Pastor Phiri",contact:"+265 99 000 0003"},
{id:4,name:"C3 Blantyre",country:"Malawi",city:"Blantyre",leader:"Pastor Chirwa",contact:"+265 88 000 0004"},
{id:5,name:"C3 Harare",country:"Zimbabwe",city:"Harare",leader:"Pastor Moyo",contact:"+263 77 000 0005"},
{id:6,name:"C3 Durban",country:"South Africa",city:"Durban",leader:"Pastor Naidoo",contact:"+27 82 000 0006"}];
function gen(cid,ba,bk,rate,gr,end){var out=[],i=0,t=Date.UTC(2025,0,5),e=Date.parse(end);
while(t<=e){var a=Math.round(ba+i*gr+7*Math.sin(i*1.7)),k=Math.round(bk+i*gr/3+4*Math.cos(i*1.3));
out.push({c:cid,d:new Date(t).toISOString().slice(0,10),a:a,k:k,o:Math.round((a+k)*rate*(0.85+0.3*Math.abs(Math.sin(i*2.3)))/10)*10});i++;t+=6048e5}return out}
var reports=[].concat(gen(1,200,80,80,.3,"2026-11-08"),gen(2,110,45,60,.2,"2026-11-08"),gen(3,140,60,6000,.25,"2026-11-08"),gen(4,80,30,5000,.1,"2026-10-25"),gen(5,160,60,8,.1,"2026-11-08"),gen(6,280,90,200,.4,"2026-11-08"));
var me=null,isMain=false,sel=null,pers={};
churches=[];reports=[];

(function(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.me){me=d.me;churches=[me]}}catch(e){}})();
var $=function(i){return document.getElementById(i)};
function n(x){return Number(x).toLocaleString("en-US")}
function cur(c){for(var i=0;i<CT.length;i++)if(CT[i][0]==c)return CT[i];return null}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},3500)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sh(v){return v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(v>=1e4?0:1)+"k":String(Math.round(v))}
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function repsOf(cid){return reports.filter(function(r){return r.c==cid}).sort(function(a,b){return a.d<b.d?-1:1})}
function inM(cid,m){return repsOf(cid).filter(function(r){return r.d.slice(0,7)==m})}
function maxAtt(cid,skip){return repsOf(cid).reduce(function(m,r){return r.d==skip?m:Math.max(m,r.a+r.k)},0)}

var IC={h:'<svg viewBox="0 0 24 24"><path d="M12 3v4M10 5h4"/><path d="M5 21V12l7-5 7 5v9z"/><path d="M10 21v-5h4v5"/></svg>',r:'<svg viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M7 5.5H5V20h14V5.5h-2"/><path d="M9 12h6M9 16h4"/></svg>',s:'<svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>',g:'<svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>',c:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',m:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>'};
var ADM=[["c","Countries","go('admin')"],["h","Churches","go('achurches')"],["m","More","go('amore')"]];
function nav(a,cur){return '<nav class="nav"><div>'+a.map(function(i){return '<button class="'+(cur==i[0]?'on':'')+'" onclick="'+i[2]+'">'+IC[i[0]]+i[1]+'</button>'}).join("")+'</div></nav>'}
var C1="var(--pr)",C2="var(--ac)";
var CC={ZM:"#1b8a5a",MW:"#c0392b",ZW:"#d68910",ZA:"#2e6fd1",BW:"#7d3c98",NA:"#16a0a8",MZ:"#c2185b",AO:"#8d6e63",TZ:"#558b2f",LS:"#5c6bc0",SZ:"#e67e22",CD:"#00838f"};
function col(cn){return CC[cur(cn)[3]]}
/* simple bar chart: one colour, number on every bar, best bar in gold */
function bars(labels,vals,col,cols){var W=320,H=180,T=24,B=24,len=labels.length,h=H-T-B,mx=Math.max.apply(null,vals.concat([1])),sl=W/len,bw=Math.min(sl*.68,48),bi=len>1?vals.indexOf(Math.max.apply(null,vals)):-1,fs=len>8?9:12,s='<svg viewBox="0 0 320 180" width="100%" role="img">';
labels.forEach(function(lb,i){var x=sl*i+(sl-bw)/2,bh=Math.max(h*vals[i]/mx,vals[i]?2:0),y=T+h-bh;
s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" style="fill:'+(cols?cols[i]:(i==bi?C2:col))+'"/>';
s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="'+fs+'" font-weight="600" style="fill:var(--tx)">'+sh(vals[i])+'</text>';
s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(T+h+16)+'" text-anchor="middle" font-size="'+(len>8?10:11)+'" style="fill:var(--mu)">'+lb+'</text>'});
return s+'<line x1="0" x2="320" y1="'+(T+h)+'" y2="'+(T+h)+'" style="stroke:var(--bd)"/></svg>'}
function best(L,V,what){var i=V.indexOf(Math.max.apply(null,V));return '<div class="mu">Gold bar = '+what+': '+L[i]+' ('+n(V[i])+')</div>'}
/* stats panel (church admin and administrator see the same) */
function paint(cid,host){$(host).innerHTML=panelHTML(cid,host)}
function setP(cid,p,host){pers[cid]=p;paint(cid,host)}
function panelHTML(cid,host){var c=churches.filter(function(x){return x.id==cid})[0],cu=cur(c.country),p=pers[cid]||"m",all=repsOf(cid);
var tabs='<div class="tabs">'+[["m","This month"],["l","Last month"],["y","Last year"]].map(function(t){return '<button class="'+(p==t[0]?'on':'')+'" onclick="setP('+cid+',\''+t[0]+'\',\''+host+'\')">'+t[1]+'</button>'}).join("")+'</div>';
if(!all.length)return tabs+'<div class="card"><p class="mu">No reports yet. Send your first Sunday report to see graphs.</p>'+(host=="pnC"?'<button class="btn o" onclick="seed()">Add sample history (demo only)</button>':'')+'</div>';
var rs=all.filter(function(r){return p=="y"?r.d.slice(0,4)=="2025":r.d.slice(0,7)==(p=="m"?THIS:PREV)});
if(!rs.length)return tabs+'<div class="card"><p class="mu">No Sundays reported in this period.</p></div>';
var L=[],A=[],K=[],O=[];
if(p=="y"){for(var i=0;i<12;i++){var ms=rs.filter(function(r){return +r.d.slice(5,7)==i+1});L.push(MN[i]);A.push(ms.length?Math.round(sum(ms,function(x){return x.a})/ms.length):0);K.push(ms.length?Math.round(sum(ms,function(x){return x.k})/ms.length):0);O.push(sum(ms,function(x){return x.o}))}}
else rs.forEach(function(r){L.push(mname(r.d)+" "+(+r.d.slice(8)));A.push(r.a);K.push(r.k);O.push(r.o)});
var TT=A.map(function(a,i){return a+K[i]}),avg=Math.round(sum(rs,function(x){return x.a+x.k})/rs.length),aA=Math.round(sum(rs,function(x){return x.a})/rs.length),aK=Math.round(sum(rs,function(x){return x.k})/rs.length);
return tabs+'<div class="stats"><div class="stat"><b>'+n(maxAtt(cid))+'</b><span>Highest attendance ever</span></div><div class="stat"><b>'+n(avg)+'</b><span>Average per Sunday</span></div><div class="stat"><b>'+rs.length+'</b><span>Sundays reported</span></div><div class="stat"><b>'+cu[1]+' '+sh(sum(rs,function(x){return x.o})*.03)+'</b><span>Levy in this period</span></div></div>'
+'<div class="card"><h3>People at church</h3><div class="mu">Adults and children together'+(p=="y"?'. Average per Sunday in each month.':'.')+'</div>'+bars(L,TT,C1)+best(L,TT,p=="y"?"best month":"best Sunday")+'<div class="mu">On average: '+n(aA)+' adults and '+n(aK)+' children</div></div>'
+'<div class="card"><h3>Offering ('+cu[1]+')</h3><div class="mu">'+(p=="y"?'Total for each month.':'Offering on each Sunday.')+'</div>'+bars(L,O,C1)+best(L,O,p=="y"?"best month":"best Sunday")+'</div>'
+(host=="pnC"?'<h3 style="margin:16px 0 6px">Save my church stats</h3>'+exp(cid):'')}
/* screens */
/* ===== ONLINE (Supabase) ===== */
var SB={u:"https://cfvqdcrxpqtvvxgtjhqt.supabase.co",k:"sb_publishable_M57uPBbr_Ygg7JwZFAe_AQ_-qhpXiUp"};
var ADN=null,curV="",AS={admin:1,achurches:1,amore:1};
function sg(k){try{return JSON.parse(localStorage.getItem("c3s_"+k)||"null")}catch(e){return null}}
function ss(k,v){try{if(v)localStorage.setItem("c3s_"+k,JSON.stringify(v));else localStorage.removeItem("c3s_"+k)}catch(e){}}
function fix(s){if(s&&s.access_token)s.exp=s.expires_at||(Date.now()/1000+(s.expires_in||3600));return s}
function raw(path,o){o=o||{};var h={apikey:SB.k,"Content-Type":"application/json"},k,ac=new AbortController(),tm=setTimeout(function(){ac.abort()},20000);
for(k in (o.h||{}))h[k]=o.h[k];
return fetch(SB.u+path,{method:o.m||"GET",headers:h,body:o.b===undefined?undefined:JSON.stringify(o.b),signal:ac.signal}).then(function(r){clearTimeout(tm);return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}
if(!r.ok){var e=new Error((j&&(j.msg||j.message||j.error_description||j.error))||("Error "+r.status));e.status=r.status;throw e}return j})}).catch(function(e){clearTimeout(tm);if(e.name=="AbortError"||e instanceof TypeError)throw new Error("No internet. Check your connection and try again.");throw e})}
function token(k){var s=sg(k);if(!s)return Promise.resolve(null);if(s.exp-60>Date.now()/1000)return Promise.resolve(s);
return raw("/auth/v1/token?grant_type=refresh_token",{m:"POST",b:{refresh_token:s.refresh_token}}).then(function(r){r=fix(r);ss(k,r);return r}).catch(function(e){if(e.status>=400&&e.status<500){ss(k,null);return null}throw e})}
function api(k,path,o){return token(k).then(function(s){if(!s)throw new Error("Please sign in again.");o=o||{};o.h=o.h||{};o.h.Authorization="Bearer "+s.access_token;return raw(path,o)})}
function anon(k){return token(k).then(function(s){return s||raw("/auth/v1/signup",{m:"POST",b:{}}).then(function(r){r=fix(r);if(!r||!r.access_token)throw new Error("Anonymous sign-in is off in Supabase.");ss(k,r);return r})})}
function emailAuth(e,p){return raw("/auth/v1/token?grant_type=password",{m:"POST",b:{email:e,password:p}}).catch(function(x){if(x.status!=400&&x.status!=401)throw x;
return raw("/auth/v1/signup",{m:"POST",b:{email:e,password:p}}).then(function(r){if(!r||!r.access_token)throw new Error("Check your email to confirm it, then sign in again.");return r}).catch(function(y){if(/already/i.test(y.message))throw new Error("Wrong password for this email.");throw y})})}
function page(k,path){var out=[];function more(off){return api(k,path+"&limit=1000&offset="+off).then(function(r){out=out.concat(r);return r.length==1000?more(off+1000):out})}return more(0)}
function norm(c){["name","country","city","leader","contact","extra"].forEach(function(f){if(c[f]==null)c[f]=""});return c}
function rep(r){return{c:r.church_id,d:r.d,a:r.a,k:r.k,o:+r.o}}
function loadAll(k){var before=JSON.stringify([churches,reports]);return Promise.all([page(k,"/rest/v1/churches?select=*&order=id"),page(k,"/rest/v1/reports?select=church_id,d,a,k,o&order=id")]).then(function(x){churches=x[0].map(norm);reports=x[1].map(rep);ADN=k;
return isMain?api(k,"/rest/v1/rpc/get_view_key",{m:"POST",b:{}}).then(function(v){if(v)VIEW=v}).catch(function(){}):0}).then(function(){return JSON.stringify([churches,reports])!=before})}
function loadMine(){return Promise.all([page("church","/rest/v1/churches?select=*&order=id"),page("church","/rest/v1/reports?select=church_id,d,a,k,o&order=id")]).then(function(x){me=x[0][0]?norm(x[0][0]):null;churches=me?[me]:[];reports=x[1].map(rep);save()})}

function emptyAdmin(v){return '<h1>Administrator</h1><p class="mu">'+(isMain?'Main admin':'View only')+'</p><div class="card"><p class="mu">No churches yet. When a church admin saves a church, it will show here.</p><button class="btn o" onclick="go(\''+v+'\')" style="width:100%">Refresh</button></div>'+nav(ADM,v=="admin"?"c":"h")}

+(s&&s.user&&s.user.email?'<div class="card"><p class="mu">Signed in as '+esc(s.user.email)+'</p><button class="btn" onclick="afterAdmin()" style="width:100%">Open admin</button></div>':'')
+'<p class="mu">Main admin: sign in with your email. The first person to sign in and enter the admin key becomes the main admin.</p><label for="em">Email</label><input id="em" type="email" autocomplete="email" value="'+esc(s&&s.user&&s.user.email||"")+'"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="At least 6 characters"><p><button class="btn" onclick="adminSignIn()" style="width:100%">Continue</button></p>'
+'<div class="card" style="margin-top:18px"><h3>View access</h3><p class="mu">Have a view key from the main admin? Type it here.</p><input id="key" autocomplete="off" placeholder="View key"><p><button class="btn o" onclick="viewLogin()" style="width:100%">Open view access</button></p>'+(w?'<button class="btn o" onclick="openView()" style="width:100%">Continue as viewer</button>':'')+'</div>'}
